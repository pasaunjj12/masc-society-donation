<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Donate | Masc Society | Built Like Her</title>
  </head>
  <body>
    <header> 
      <nav>
        <ul>
           <li><a href="index.html">Home</a></li>
          <li><a href="about-us.html">About Us</a></li>
          <li><a href="donate.html">Donate</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <h1>Support Masc Society | Built Like Her</h1>
      <p>Empowering the culture. Uplifting our people.</p>
      <div class="hero-logos">
        <img src="images/image0.png" alt="built like her logo" width="300">
        <img src="images/image1 (1).png" alt="masc society logo" width="300">
      </div>
    </header>
    <main>
        <form action="checkout.html">
            <h2>Donor Information</h2>
            <div class="donor-field">
              <label class="donor-label" for="first-name">First Name (required):</label>
              <input required id="first-name" name="first-name" type="text" placeholder="Jane">
            </div>

            <div class="donor-field">
              <label class="donor-label" for="last-name">Last Name (required):</label>
              <input required id="last-name" name="last-name" type="text" placeholder="Doe">
            </div>

            <div class="donor-field">
              <label class="donor-label" for="email">Email</label>
              <input required id="email" type="email" name="email" placeholder="example@email.com">
            </div>

            <h2>Donation Information</h2>

            <p>What type of donation would you like to make?</p>
            <label  for="one-time-donation">One-Time Donation</label>
            <input required type="radio" name="donation-type" id="one-time-donation" value="one-time-donation">
            
            <label  for="recurring-donation">Recurring Donation</label>
            <input type="radio" name="donation-type" id="recurring-donation" value="recurring-donation">
        
            <p>Donation Amount ($):</p>

            <input type="radio" name="donation-amount" id="amount-5" value="5">
            <label class="amount-options" for="amount-5">$5</label>

            <input type="radio" name="donation-amount" id="amount-10" value="10">
            <label class="amount-options" for="amount-10">$10</label>

            <input type="radio" name="donation-amount" id="amount-20" value="20">
            <label class="amount-options" for="amount-20">$20</label>

            <input type="radio" name="donation-amount" id="amount-25" value="25">
            <label class="amount-options" for="amount-25">$25</label>
            
            <input type="radio" name="donation-amount" id="amount-50" value="50">
            <label class="amount-options" for="amount-50">$50</label>

            <div class="custom-amount">
              <label for="custom-amount">Custom Amount</label>
              <input type="number" name="donation-amount" id="custom-amount" min="5">
            </div>

              <button type="submit">Donate Now</button>
        </form>
    </main>
  </body>
</html>
